<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color" content="#f6f2ea" />
    <!--
      First paint. Reads the small copy of the appearance this device keeps (written by the app each time it changes) and sets the
      same attributes and colours the app will set, so there is no flash of the wrong theme. It makes no request, and the app
      checks and applies everything again as soon as it starts.
    -->
    <script>
      (function () {
        try {
          var r = document.documentElement;
          var raw = localStorage.getItem('cleanflow:appearance');
          var m = raw ? JSON.parse(raw) : null;
          var a = (m && m.a) || {};
          if (!m) { var old = localStorage.getItem('cleanflow:theme'); if (old === 'light' || old === 'dark') a = { theme: old }; }
          var pick = function (v, list) { return list.indexOf(v) >= 0 ? v : null; };
          var dark = a.theme === 'dark' || (a.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var reduced = a.motion === 'reduced' || (a.motion !== 'full' && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          var theme = pick(a.theme, ['light', 'dark']);
          if (theme) r.setAttribute('data-theme', theme);
          var set = function (name, v) { if (v) r.setAttribute(name, v); };
          set('data-palette', pick(a.palette, ['sage', 'ocean', 'dusk', 'sunrise', 'graphite']));
          set('data-font', pick(a.font, ['standard', 'system', 'serif', 'clear']));
          set('data-size', pick(a.fontSize, ['small', 'medium', 'large', 'xlarge']));
          set('data-density', pick(a.density, ['comfortable', 'compact']));
          r.setAttribute('data-motion', reduced ? 'reduced' : 'full');
          r.style.setProperty('color-scheme', dark ? 'dark' : 'light');
          var vars = m && m.vars && m.vars[dark ? 'dark' : 'light'];
          if (vars) for (var k in vars) {
            if (/^(--[a-z0-9-]+|font-size)$/.test(k) && /^[#%a-z0-9 ,.'"()-]+$/i.test(String(vars[k]))) r.style.setProperty(k, vars[k]);
          }
          var bg = (vars && vars['--bg']) || (dark ? '#131815' : '#f6f2ea');
          document.getElementById('theme-color').setAttribute('content', bg);
        } catch (e) { /* the app applies the appearance itself once it starts */ }
      })();
    </script>
    <meta name="description" content="CleanFlow builds one realistic daily plan for your home and everyday life around your actual time and energy." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CleanFlow — one calm plan for your home and your day</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
